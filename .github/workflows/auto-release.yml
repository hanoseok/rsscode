name: Auto Release

# On every push to main:
#   1. Analyze commit messages since the last v* tag.
#   2. If any feat: / fix: / perf: / refactor: / BREAKING CHANGE commits
#      are present, compute the next semver and push a new v* tag.
#   3. Trigger the Docker build and the tarball Release in parallel.
#
# If only docs:/chore:/test: commits exist since the last tag, nothing
# happens — no new tag, no release.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version and push tag
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: false
          fetch_all_tags: true
          custom_release_rules: |
            feat:minor,
            fix:patch,
            perf:patch,
            refactor:patch,
            security:patch

  docker:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.tag.outputs.new_tag }}
    secrets: inherit

  release:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.new_tag }}
    secrets: inherit
